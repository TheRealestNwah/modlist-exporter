name: Deploy to GitHub Pages

# Deploys on a published release, NOT on every push to main.
#
# This keeps `main` as "finished work that hasn't shipped yet" rather than
# "whatever is currently live". Merge features to main freely; the live site
# only changes when you publish a release on GitHub.
#
# Note that pushing a bare tag does not deploy — the release has to actually
# be published. Use the Actions tab's "Run workflow" button (workflow_dispatch)
# if you ever need to redeploy the current main without cutting a release.
#
# workflow_call exists so release.yml can run this directly. A release created
# with the built-in GITHUB_TOKEN deliberately does not raise events that start
# other workflows, so the release: published trigger below never fires for one
# cut by that workflow. Calling this rather than waiting to be triggered is what
# makes cutting a release a single button, and it needs no stored token to do
# it. Releases published from the GitHub web UI still arrive via release: above.
on:
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # On a release event this resolves to the commit the tag points at.
      # Called from release.yml it resolves to the commit that workflow was
      # dispatched against, which is the same commit it just tagged. Either
      # way the deployed site is exactly the released code.
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v5
