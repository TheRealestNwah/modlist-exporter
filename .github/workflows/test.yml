name: Tests

# Runs on every PR into main, and on main itself. Deploys are handled
# separately by deploy.yml, which only fires on a published release.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # No dependencies to install: the suite uses node:test and lifts the
      # pure functions straight out of index.html. The smoke tests drive a
      # real browser over the DevTools protocol, using the Chrome already on
      # the runner -- still nothing to install.
      #
      # SMOKE_REQUIRED makes a missing browser fail rather than skip. Without
      # it a runner without Chrome would go green having tested none of the
      # wiring, which is worse than not having the tests.
      - run: node --test test/*.test.js
        env:
          SMOKE_REQUIRED: '1'
