name: Cut release

# Publishing a release stays a deliberate act: this never runs on its own, only
# when someone dispatches it from the Actions tab (or the API). It exists so a
# release can be cut without the GitHub web UI.
#
# The tag is created at whatever main points to when this runs, and the test
# suite has to pass first — a tag is permanent, so it should not be put on a
# commit nobody checked.
#
# One caveat worth knowing: a release created with the built-in GITHUB_TOKEN
# does NOT trigger other workflows, so deploy.yml will not fire for a release
# cut this way. Use the "Run workflow" button on Deploy to Pages afterwards if
# the live site needs to move.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to tag, without a leading v (e.g. 0.9.0)'
        required: true
        type: string
      notes:
        description: 'Release body, in markdown'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Same suite test.yml runs. No dependencies to install.
      - run: node --test test/*.test.js

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed as environment rather than interpolated into the script:
          # release notes contain backticks and $( ), which would otherwise be
          # executed by the shell rather than written to the file.
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          case "$TAG" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Tag '$TAG' should look like 0.9.0, with no leading v"; exit 1 ;;
          esac
          printf '%s' "$NOTES" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" \
            --title "v$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA"
