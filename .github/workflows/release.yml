name: Cut release

# Publishing a release stays a deliberate act: this never runs on its own, only
# when someone dispatches it from the Actions tab (or the API). It exists so a
# release can be cut without the GitHub web UI.
#
# The tag is created at whatever main points to when this runs, and the test
# suite has to pass first — a tag is permanent, so it should not be put on a
# commit nobody checked.
#
# A release created with the built-in GITHUB_TOKEN does not raise events that
# start other workflows, so deploy.yml's release: published trigger never fires
# for a release cut here. Rather than storing a personal access token purely to
# work around that, this calls deploy.yml directly as a second job. One button
# tags, tests, releases and deploys.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to tag, without a leading v (e.g. 0.9.0)'
        required: true
        type: string
      notes:
        description: 'Release body, in markdown'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Same suite test.yml runs. No dependencies to install.
      - run: node --test test/*.test.js

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed as environment rather than interpolated into the script:
          # release notes contain backticks and $( ), which would otherwise be
          # executed by the shell rather than written to the file.
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          case "$TAG" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Tag '$TAG' should look like 0.9.0, with no leading v"; exit 1 ;;
          esac
          printf '%s' "$NOTES" > "$RUNNER_TEMP/notes.md"
          # The tool is one self-contained file, so that file is the release
          # artifact. Uploading it under a versioned name means someone can
          # download one thing and open it -- no unzip, and no puzzling a week
          # later over which index.html is sitting in Downloads. Without this
          # the only downloads are GitHub's auto-generated source archives,
          # which are the whole repo, tests and workflows included.
          ASSET="$RUNNER_TEMP/modlist-exporter-$TAG.html"
          cp index.html "$ASSET"
          gh release create "$TAG" \
            --title "v$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA" \
            "$ASSET"

  # Runs only if the release job succeeded, so a failed tag never deploys.
  # Permissions have to be granted here: a called workflow gets what the
  # caller gives it, not what it declares for itself.
  deploy:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
